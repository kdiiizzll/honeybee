<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>New message</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;color:#fff;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{font-family:'Share Tech Mono',ui-monospace,Menlo,monospace}
.scene{position:fixed;inset:0;display:none}
.scene.on{display:block}
/* start */
#start{display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;gap:18px}
#start .dot{width:10px;height:10px;border-radius:50%;background:#2f2;box-shadow:0 0 12px #2f2;animation:pulse 1.4s infinite}
#start p{font-size:14px;color:#9a9a9a;letter-spacing:.06em;animation:blink 2.2s infinite}
@keyframes pulse{50%{transform:scale(1.6);opacity:.4}}
@keyframes blink{50%{opacity:.35}}
/* hack */
#hack{background:#000}
#rain{position:absolute;inset:0;width:100%;height:100%}
#term{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 22px) 18px 0;font-size:14px;line-height:1.55;color:#3f3;text-shadow:0 0 6px #0f0;z-index:2}
#term .l{white-space:pre-wrap;word-break:break-word}
#term .red{color:#ff3b3b;text-shadow:0 0 8px #f00}
#term .cur{display:inline-block;width:8px;height:15px;background:#3f3;vertical-align:-2px;animation:blink .6s steps(1) infinite}
#prog{position:absolute;left:18px;right:18px;bottom:calc(env(safe-area-inset-bottom) + 70px);z-index:2;display:none}
#prog .lab{font-size:13px;color:#3f3;margin-bottom:8px;text-shadow:0 0 6px #0f0}
#prog .bar{height:14px;border:1px solid #3f3;padding:2px;box-shadow:0 0 10px #0f04 inset}
#prog .fill{height:100%;width:0;background:repeating-linear-gradient(90deg,#3f3 0 8px,#1a1 8px 10px);box-shadow:0 0 10px #0f0}
#breach{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:3;pointer-events:none;text-align:center}
#breach span{font-size:clamp(34px,11vw,64px);font-weight:700;color:#ff2020;letter-spacing:.08em;text-shadow:0 0 18px #f00,3px 0 #0ff,-3px 0 #f0f;animation:flash .18s steps(1) infinite;background:#0008;padding:8px 14px;border:3px solid #f22}
@keyframes flash{50%{opacity:.15}}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:4;background:#0a0000cc;text-align:center;padding:24px}
#err .t{font-size:clamp(20px,6.4vw,34px);color:#ff4040;text-shadow:0 0 12px #f00}
#err .s{margin-top:14px;font-size:15px;color:#ffb3b3}
.glitch{position:relative}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;inset:0;overflow:hidden}
.glitch::before{color:#0ff;transform:translate(-3px,0);clip-path:inset(0 0 55% 0);animation:g1 .35s infinite steps(2)}
.glitch::after{color:#f0f;transform:translate(3px,0);clip-path:inset(55% 0 0 0);animation:g2 .3s infinite steps(2)}
@keyframes g1{0%{clip-path:inset(0 0 70% 0)}50%{clip-path:inset(20% 0 40% 0);transform:translate(4px,-1px)}}
@keyframes g2{0%{clip-path:inset(60% 0 0 0)}50%{clip-path:inset(40% 0 20% 0);transform:translate(-4px,1px)}}
.shake{animation:shake .12s infinite}
@keyframes shake{0%{transform:translate(2px,-1px)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,1px)}75%{transform:translate(-2px,-2px)}100%{transform:translate(1px,2px)}}
.rgb{filter:drop-shadow(4px 0 0 rgba(255,0,0,.75)) drop-shadow(-4px 0 0 rgba(0,255,255,.75))}
#scan{position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50;transition:opacity .12s}
/* paris */
#paris{background:radial-gradient(120% 70% at 50% 100%,#3a1f4d 0%,#1a1440 35%,#0a0b25 70%,#04040f 100%);overflow:hidden}
#stars{position:absolute;inset:0;width:100%;height:100%}
#moon{position:absolute;top:calc(env(safe-area-inset-top) + 7%);right:12%;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe8,#f2e3b0 60%,#d9c58a);box-shadow:0 0 40px 10px #fff3c455}
#tower{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:62vh;max-height:620px;width:auto;opacity:0;transition:opacity 2s ease}
#paris.show #tower{opacity:1}
.tw{animation:tw 1.2s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
#beam{transform-origin:0 0;animation:beam 6s linear infinite}
@keyframes beam{0%{transform:rotate(-60deg)}50%{transform:rotate(60deg)}100%{transform:rotate(-60deg)}}
#glow{position:absolute;left:50%;bottom:0;width:120vw;height:40vh;transform:translateX(-50%);background:radial-gradient(50% 60% at 50% 100%,#ffcf7a33,transparent 70%);pointer-events:none}
#floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.heart,.bee{position:absolute;bottom:-40px;will-change:transform,opacity}
.heart{color:#ff5c8a;text-shadow:0 0 10px #ff2d6f99;animation:rise linear forwards}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}10%{opacity:.95}100%{transform:translate(var(--dx),-110vh) scale(1.1);opacity:0}}
.bee{font-size:26px;animation:buzz linear forwards}
@keyframes buzz{0%{transform:translate(-15vw,0)}25%{transform:translate(25vw,-8vh) rotate(8deg)}50%{transform:translate(55vw,2vh) rotate(-6deg)}75%{transform:translate(85vw,-6vh) rotate(6deg)}100%{transform:translate(120vw,0)}}
#card{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 30px) 22px 0;text-align:center;z-index:3;max-width:560px;margin:0 auto;max-height:64vh;overflow:hidden}
#card .msg{font-family:'Great Vibes',cursive;font-size:clamp(23px,6.6vw,36px);line-height:1.28;color:#fff6e6;text-shadow:0 2px 14px #000c,0 0 22px #ffcf7a55}
#card .msg span{opacity:0;display:inline;transition:opacity 1.1s ease}
#card .msg span.v{opacity:1}
#bottom{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:4;text-align:center;opacity:0;transition:opacity 1.4s ease;padding:0 16px}
#bottom.v{opacity:1}
#cd{display:inline-flex;gap:8px;padding:10px 14px;border-radius:18px;background:rgba(10,8,30,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid #ffffff22;font-family:'Cormorant Garamond',Georgia,serif}
#cd div{min-width:52px}
#cd b{display:block;font-size:26px;font-weight:600;color:#ffe2a8;font-variant-numeric:tabular-nums}
#cd i{font-style:normal;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#d6cfe8}
#cdlab{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;color:#f3e9ff;font-size:16px;margin-bottom:8px;text-shadow:0 1px 8px #000}
#replay{margin-top:12px;font-family:'Cormorant Garamond',Georgia,serif;font-size:16px;letter-spacing:.12em;color:#fff;background:linear-gradient(135deg,#ff5c8a,#c34bff);border:0;border-radius:999px;padding:10px 26px;box-shadow:0 6px 20px #ff5c8a55;cursor:pointer}
@media (max-height:640px){#card .msg{font-size:clamp(20px,5.6vw,28px)}#tower{height:52vh}#cd b{font-size:22px}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body>
<div id="start" class="scene on"><div class="dot"></div><p>Tap to open message from Bear</p></div>

<div id="hack" class="scene">
  <canvas id="rain"></canvas>
  <div id="term"></div>
  <div id="prog"><div class="lab" id="plab">Breaking into Honeybee's heart... 0%</div><div class="bar"><div class="fill" id="pfill"></div></div></div>
  <div id="breach"><span>SYSTEM BREACH</span></div>
  <div id="err"><div class="t glitch" data-t="ERROR: heart already taken by Bear">ERROR: heart already taken by Bear</div><div class="s">access level: forever 🐻</div></div>
  <div id="scan"></div>
</div>

<div id="paris" class="scene">
  <canvas id="stars"></canvas>
  <div id="moon"></div>
  <div id="glow"></div>
  <svg id="tower" viewBox="0 0 200 400" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
    <defs>
      <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd98a"/><stop offset="1" stop-color="#c8862e"/></linearGradient>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff6c8" stop-opacity=".0"/><stop offset=".15" stop-color="#fff6c8" stop-opacity=".35"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></linearGradient>
    </defs>
    <g id="beam" transform="translate(100,22)"><polygon points="0,0 260,-30 260,30" fill="url(#bg)"/></g>
    <g fill="none" stroke="url(#tg)" stroke-width="1.6" stroke-linejoin="round">
      <!-- antenna -->
      <line x1="100" y1="6" x2="100" y2="28" stroke-width="1.4"/>
      <!-- top section -->
      <path d="M96 28 L104 28 L108 60 L92 60 Z" fill="#a8692655"/>
      <path d="M92 60 L84 140 M108 60 L116 140"/>
      <path d="M93 70 L107 70 M91 85 L109 85 M89 100 L111 100 M87 115 L113 115 M86 128 L114 128"/>
      <path d="M92 60 L109 85 L89 100 L113 115 L86 128 M108 60 L91 85 L111 100 L87 115 L114 128" stroke-width=".8" opacity=".8"/>
      <!-- second platform -->
      <rect x="80" y="140" width="40" height="7" fill="#c8862e88"/>
      <path d="M82 147 L64 245 M118 147 L136 245"/>
      <path d="M86 147 L74 245 M114 147 L126 245" stroke-width=".9"/>
      <path d="M79 165 L121 165 M76 185 L124 185 M72 205 L128 205 M68 225 L132 225" stroke-width="1"/>
      <path d="M82 147 L124 185 L72 205 L132 225 M118 147 L76 185 L128 205 L68 225" stroke-width=".7" opacity=".75"/>
      <!-- first platform -->
      <rect x="58" y="245" width="84" height="9" fill="#c8862e88"/>
      <path d="M60 254 L22 396 M140 254 L178 396"/>
      <path d="M68 254 L44 396 M132 254 L156 396" stroke-width="1"/>
      <path d="M54 280 L146 280 M47 305 L153 305" stroke-width=".9"/>
      <path d="M60 254 L153 305 M140 254 L47 305" stroke-width=".7" opacity=".7"/>
      <!-- arch -->
      <path d="M44 396 Q100 300 156 396" stroke-width="2.2"/>
      <line x1="14" y1="396" x2="186" y2="396" stroke-width="1.2" opacity=".6"/>
    </g>
    <g id="lights"></g>
  </svg>
  <div id="floaters"></div>
  <div id="card"><div class="msg" id="msg"></div></div>
  <div id="bottom">
    <div id="cdlab">Until I marry my Honeybee · Nov 14, 12:00 noon</div>
    <div id="cd"><div><b id="cdd">0</b><i>days</i></div><div><b id="cdh">0</b><i>hrs</i></div><div><b id="cdm">0</b><i>min</i></div><div><b id="cds">0</b><i>sec</i></div></div>
    <div><button id="replay">↻ Replay</button></div>
  </div>
</div>
<div id="flash"></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const MSG="Honeybee, sorry for hacking your phone 😏 I just had to get into your heart one more time. In two weeks I get to marry my best friend, and then it's you, me, and Paris. I love you more than every star over the Eiffel Tower. Forever yours, Bear 🐻❤️🐝";
const WEDDING=Date.parse('2026-11-14T17:00:00Z');
let timers=[],raf=null,ac=null,running=false;
const later=(fn,ms)=>{const t=setTimeout(fn,ms);timers.push(t);return t};
const clearAll=()=>{timers.forEach(clearTimeout);timers=[];if(raf)cancelAnimationFrame(raf);raf=null};
const vib=p=>{try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}};
function beep(f,d,type,vol){
  if(!ac)return;try{
  const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.value=f;
  g.gain.setValueAtTime(vol||.05,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d+.02);}catch(e){}
}
function chime(){if(!ac)return;[523.25,659.25,783.99,1046.5].forEach((f,i)=>later(()=>beep(f,1.4,'sine',.06),i*180))}
function show(id){document.querySelectorAll('.scene').forEach(s=>s.classList.toggle('on',s.id===id))}
function flash(ms){const f=$('flash');f.style.transition='none';f.style.opacity=1;requestAnimationFrame(()=>{f.style.transition='opacity '+(ms||500)+'ms ease';f.style.opacity=0})}

/* ---------- matrix rain ---------- */
function startRain(){
  const c=$('rain'),x=c.getContext('2d');const dpr=Math.min(window.devicePixelRatio||1,2);
  const W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.scale(dpr,dpr);
  const fs=15,cols=Math.ceil(W/fs),drops=Array.from({length:cols},()=>Math.random()*-H/fs);
  const chars='アイウエオカキクケコサシスセソ01010101ハニービーBEAR♥<>/{}#$%'.split('');
  x.fillStyle='#000';x.fillRect(0,0,W,H);let last=0;
  function frame(t){
    raf=requestAnimationFrame(frame);if(t-last<45)return;last=t;
    x.fillStyle='rgba(0,0,0,0.09)';x.fillRect(0,0,W,H);x.font=fs+'px monospace';
    for(let i=0;i<cols;i++){const ch=chars[(Math.random()*chars.length)|0];const y=drops[i]*fs;
      x.fillStyle=Math.random()<.04?'#d6ffd6':(ch==='♥'?'#ff4d7d':'#1f1');x.fillText(ch,i*fs,y);
      if(y>H&&Math.random()>.975)drops[i]=0;drops[i]++;}
  }
  raf=requestAnimationFrame(frame);
}

/* ---------- terminal ---------- */
const LINES=[
 ['> initializing bear_toolkit v14.11...',0],
 ['> connecting to HELINA_PHONE...',0],
 ['> handshake OK  [signal: 💛 strong]',0],
 ['> bypassing firewall...',0],
 ['> WARNING: firewall made of love detected',1],
 ['> decrypting smile.dat ............ done',0],
 ['> accessing heart.exe...',0],
];
function typeLines(done){
  const term=$('term');term.innerHTML='';let li=0;
  function next(){
    if(li>=LINES.length){done();return}
    const [txt,red]=LINES[li++];const d=document.createElement('div');d.className='l'+(red?' red':'');
    const cur=document.createElement('span');cur.className='cur';term.appendChild(d);
    let ci=0;(function tick(){d.textContent=txt.slice(0,++ci);d.appendChild(cur);if(ci%3===0)beep(1200+Math.random()*600,.03,'square',.02);
      if(ci<txt.length)later(tick,16);else{cur.remove();if(red){vib([80,40,80]);beep(220,.25,'sawtooth',.05);document.body.classList.add('rgb');later(()=>document.body.classList.remove('rgb'),300)}later(next,160)}})();
  }
  next();
}
function progress(done){
  $('prog').style.display='block';let p=0;
  (function step(){p=Math.min(100,p+(p>80?2:Math.random()*7+3)|0);$('pfill').style.width=p+'%';
    $('plab').textContent="Breaking into Honeybee's heart... "+p+'%';
    if(p%10<4)beep(600+p*8,.04,'square',.025);
    if(p<100)later(step,90);else later(done,250)})();
}
function breach(done){
  const h=$('hack');h.classList.add('shake');$('breach').style.display='flex';
  vib([200,100,200,100,400]);let n=0;
  (function siren(){beep(n%2?880:440,.18,'sawtooth',.05);if(++n<8)later(siren,170)})();
  later(()=>{document.body.classList.add('rgb')},300);
  later(()=>{$('breach').style.display='none';$('err').style.display='flex';vib([500]);beep(110,.6,'sawtooth',.07);},1400);
  later(()=>{document.body.classList.remove('rgb');h.classList.remove('shake');done()},3200);
}

/* ---------- paris ---------- */
let starRaf=null,floatTimer=null;
function stars(){
  const c=$('stars'),x=c.getContext('2d');const dpr=Math.min(window.devicePixelRatio||1,2);
  const W=innerWidth,H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.scale(dpr,dpr);
  const S=Array.from({length:Math.round(W*H/2600)},()=>({x:Math.random()*W,y:Math.random()*H*.8,r:Math.random()*1.3+.2,p:Math.random()*6.28,s:Math.random()*.03+.01}));
  let shoot=null,last=0;
  function f(t){starRaf=requestAnimationFrame(f);if(t-last<33)return;last=t;x.clearRect(0,0,W,H);
    for(const s of S){s.p+=s.s;const a=.35+.65*Math.abs(Math.sin(s.p));x.globalAlpha=a;x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill()}
    if(!shoot&&Math.random()<.006)shoot={x:Math.random()*W*.7,y:Math.random()*H*.3,l:0};
    if(shoot){x.globalAlpha=1-shoot.l/40;x.strokeStyle='#fff';x.lineWidth=1.5;x.beginPath();x.moveTo(shoot.x,shoot.y);x.lineTo(shoot.x-30,shoot.y-12);x.stroke();shoot.x+=9;shoot.y+=3.6;if(++shoot.l>40)shoot=null}
    x.globalAlpha=1;}
  starRaf=requestAnimationFrame(f);
}
function towerLights(){
  const g=$('lights');g.innerHTML='';const ns='http://www.w3.org/2000/svg';
  // sample points along tower edges
  const segs=[[96,28,92,60],[104,28,108,60],[92,60,84,140],[108,60,116,140],[82,147,64,245],[118,147,136,245],[60,254,22,396],[140,254,178,396],[80,143,120,143],[58,249,142,249]];
  for(let i=0;i<90;i++){const s=segs[(Math.random()*segs.length)|0];const t=Math.random();
    const cx=s[0]+(s[2]-s[0])*t+(Math.random()-.5)*6,cy=s[1]+(s[3]-s[1])*t;
    const e=document.createElementNS(ns,'circle');e.setAttribute('cx',cx);e.setAttribute('cy',cy);e.setAttribute('r',(Math.random()*1.1+.5).toFixed(2));
    e.setAttribute('fill',Math.random()<.8?'#fffbe0':'#bfe6ff');e.setAttribute('class','tw');
    e.style.animationDelay=(Math.random()*1.2).toFixed(2)+'s';e.style.animationDuration=(.6+Math.random()*1.2).toFixed(2)+'s';g.appendChild(e)}
  const top=document.createElementNS(ns,'circle');top.setAttribute('cx',100);top.setAttribute('cy',8);top.setAttribute('r',2.5);top.setAttribute('fill','#ff6b8f');top.setAttribute('class','tw');g.appendChild(top);
}
function floaters(){
  const box=$('floaters');let k=0;
  floatTimer=setInterval(()=>{
    if(box.childElementCount>26)return;
    const bee=(k++%7===0);const e=document.createElement('div');
    if(bee){e.className='bee';e.textContent='🐝';e.style.bottom=(25+Math.random()*45)+'vh';e.style.left='0';e.style.animationDuration=(7+Math.random()*4)+'s'}
    else{e.className='heart';e.textContent=Math.random()<.85?'❤':'💕';e.style.left=(Math.random()*100)+'vw';e.style.fontSize=(12+Math.random()*20)+'px';
      e.style.setProperty('--dx',((Math.random()-.5)*30)+'vw');e.style.animationDuration=(6+Math.random()*5)+'s'}
    box.appendChild(e);e.addEventListener('animationend',()=>e.remove());
  },380);
}
function message(){
  const m=$('msg');m.innerHTML='';
  const parts=MSG.match(/[^.?!😏]+[.?!😏]?\s*/gu)||[MSG];
  // group into phrases
  parts.forEach(p=>{const s=document.createElement('span');s.textContent=p;m.appendChild(s)});
  [...m.children].forEach((s,i)=>later(()=>s.classList.add('v'),600+i*1100));
  later(()=>$('bottom').classList.add('v'),600+parts.length*1100);
}
function countdown(){
  const pad=n=>String(n).padStart(2,'0');
  function u(){let d=Math.max(0,WEDDING-Date.now());const s=Math.floor(d/1000);
    $('cdd').textContent=Math.floor(s/86400);$('cdh').textContent=pad(Math.floor(s%86400/3600));$('cdm').textContent=pad(Math.floor(s%3600/60));$('cds').textContent=pad(s%60);
    if(d===0)$('cdlab').textContent='Today I married my Honeybee 💍'}
  u();setInterval(u,1000);
}
function paris(){
  if(raf)cancelAnimationFrame(raf);raf=null;
  show('paris');$('paris').classList.remove('show');$('bottom').classList.remove('v');
  if(!starRaf)stars();towerLights();if(!floatTimer)floaters();
  requestAnimationFrame(()=>$('paris').classList.add('show'));chime();vib([60,60,60]);message();
}
function run(){
  clearAll();running=true;
  ['err','breach'].forEach(i=>$(i).style.display='none');$('prog').style.display='none';$('pfill').style.width='0';
  show('hack');startRain();
  later(()=>typeLines(()=>progress(()=>breach(()=>{flash(900);vib([30]);beep(80,.4,'triangle',.08);later(paris,120)}))),400);
}
let cdStarted=false;
$('start').addEventListener('click',()=>{
  try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){ac=new AC();ac.resume&&ac.resume()}}catch(e){}
  try{const de=document.documentElement;const rf=de.requestFullscreen||de.webkitRequestFullscreen;if(rf){const p=rf.call(de);p&&p.catch&&p.catch(()=>{})}}catch(e){}
  vib(40);if(!cdStarted){countdown();cdStarted=true}run();
});
$('replay').addEventListener('click',e=>{e.stopPropagation();run()});
})();
</script>
</body>
</html>
